name: Check Movie Status 🎫

on:
  # schedule:
  #   # Runs every 15 minutes. GitHub may delay this slightly under load.
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run booking check
        run: python check_booking.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "booking-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet state.txt 2>/dev/null; then
            git add state.txt
            git commit -m "Update booking state"
            git push
          else
            echo "No state change to commit."
          fi
